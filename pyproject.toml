[project]
name = "debug907"
version = "1.0.0"
description = "Natural-language code retrieval. Samsung PRISM GenAI Hackathon, Theme 01."
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
  "torch==2.14.0",
  "transformers==4.56.2",
  "tokenizers==0.22.2",
  "sentence-transformers==4.1.0",
  "einops==0.8.2",
  "numpy==2.5.1; python_version >= '3.12'",
  "numpy==2.4.6; python_version < '3.12'",
  "huggingface_hub==0.36.2",
  "safetensors==0.8.0",
  "rich==15.0.0",
  "Pygments==2.20.0",
]

[project.optional-dependencies]
eval = [
  "mteb==2.21.5",
  "datasets==5.0.1",
  "pytrec_eval-terrier==0.5.10",
]
test = ["pytest==9.1.1"]

[project.scripts]
debug907 = "cli:main"

[tool.setuptools]
py-modules = ["cli", "app", "banner", "encoder", "run_mteb"]

[tool.setuptools.packages.find]
include = ["pipeline*", "retrieval*", "bench*", "tools*"]
